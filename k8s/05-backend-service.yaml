apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: aura-beauty
  labels:
    app: backend
spec:
  type: ClusterIP # Internal only — traffic enters via Ingress
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 80 # Port the Service listens on inside the cluster
      targetPort: 3001 # Port the container actually listens on
